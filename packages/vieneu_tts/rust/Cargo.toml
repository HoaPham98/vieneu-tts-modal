[package]
name = "rust_lib_vieneu_tts"
version = "0.1.1"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
audio-cpp = { version = "0.8.1", default-features = false, features = ["model-vieneu-v3-turbo"] }
sea-g2p-rs = { git = "https://github.com/pnnbao97/sea-g2p.git", default-features = false, features = ["capi"] }
anyhow = "1.0"
once_cell = "1.19"
parking_lot = "0.12"
hound = "3.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.10"
libc = "0.2"
