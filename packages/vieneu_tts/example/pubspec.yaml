name: vieneu_tts_example
description: "Demonstration application for VieNeu-TTS on-device Vietnamese Text-to-Speech library."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  vieneu_tts:
    path: ../
  path_provider: ^2.1.2
  audioplayers: ^6.0.0
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
