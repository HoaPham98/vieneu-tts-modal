name: vieneu_tts
description: High-performance on-device Vietnamese Text-to-Speech library powered by VieNeu-TTS v3 Turbo, audio.cpp, and Flutter Rust Bridge.
version: 0.1.0
homepage: https://github.com/HoaPham98/vieneu-tts-modal

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_rust_bridge: ^2.0.0
  http: ^1.2.0
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.vieneu.tts
        pluginClass: VieneuTtsPlugin
      ios:
        pluginClass: VieneuTtsPlugin
