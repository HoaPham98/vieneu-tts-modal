name: vieneu_tts_example
description: "Demonstration application for VieNeu-TTS on-device Vietnamese Text-to-Speech library."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_vieneu_tts:
    path: ../
  vieneu_tts:
    path: ../../vieneu_tts
  path_provider: ^2.1.2
  audioplayers: ^6.0.0
  path: ^1.9.0
  flutter_rust_bridge: 2.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
