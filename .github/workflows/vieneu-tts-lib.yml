name: VieNeu-TTS Dart & Native CI

on:
  workflow_dispatch:
    inputs:
      run_e2e_test:
        description: "Download 188MB GGUF model and run full synthesis test"
        type: boolean
        required: false
        default: false

concurrency:
  group: vieneu-tts-lib-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codegen:
    name: Generate Bridge Bindings
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.93.1"

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install flutter_rust_bridge_codegen v2.13.0
        run: |
          curl -sSfL https://github.com/fzyzcjy/flutter_rust_bridge/releases/download/v2.13.0/flutter_rust_bridge_codegen-x86_64-unknown-linux-gnu-v2.13.0.tgz | sudo tar -xz -C /usr/local/bin || \
          curl -sSfL https://github.com/fzyzcjy/flutter_rust_bridge/releases/download/v2.13.0/flutter_rust_bridge_codegen-x86_64-unknown-linux-gnu.tar.gz | sudo tar -xz -C /usr/local/bin || \
          cargo install flutter_rust_bridge_codegen --version 2.13.0 --locked
          flutter_rust_bridge_codegen --version

      - name: Generate Bindings
        run: |
          mkdir -p packages/vieneu_tts/lib/src/rust
          cd packages/vieneu_tts
          flutter pub get
          flutter_rust_bridge_codegen generate

      - name: Upload Generated Bindings
        uses: actions/upload-artifact@v4
        with:
          name: frb-bindings
          path: |
            packages/vieneu_tts/lib/src/rust/
            packages/vieneu_tts/rust/src/frb_generated.*
          retention-days: 1

  dart-lint:
    name: Dart Analysis & Hook Unit Tests
    needs: [codegen]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/vieneu_tts

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Generated Bindings
        uses: actions/download-artifact@v4
        with:
          name: frb-bindings
          path: packages/vieneu_tts

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: |
          flutter pub get
          cd ../flutter_vieneu_tts && flutter pub get
          cd example && flutter pub get

      - name: Analyze code and run build hook unit tests
        run: |
          flutter analyze
          mkdir -p .dart_tool
          touch .dart_tool/mock_lib.so
          printf "VIENEU_TTS_BUILD_MODE=prebuilt\nVIENEU_TTS_LOCAL_LIB=%s/.dart_tool/mock_lib.so\n" "$(pwd)" > .dart_tool/vieneu_tts_env
          dart test test/build_hook_test.dart --verbose
          rm -f .dart_tool/vieneu_tts_env .dart_tool/mock_lib.so

  test-hook-source-mode:
    name: Test Hook in Source Mode (VIENEU_TTS_BUILD_MODE=source)
    needs: [codegen]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/vieneu_tts

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Generated Bindings
        uses: actions/download-artifact@v4
        with:
          name: frb-bindings
          path: packages/vieneu_tts

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.93.1"
          targets: x86_64-unknown-linux-gnu

      - name: Install build tools (CMake, Ninja, ALSA)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build libasound2-dev

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/vieneu_tts/rust

      - name: Run tests with VIENEU_TTS_BUILD_MODE=source
        env:
          VIENEU_TTS_BUILD_MODE: "source"
        run: |
          flutter pub get
          mkdir -p .dart_tool
          echo "VIENEU_TTS_BUILD_MODE=source" > .dart_tool/vieneu_tts_env
          flutter test --verbose
          rm -f .dart_tool/vieneu_tts_env

      - name: Package built Linux library for prebuilt-mode job
        working-directory: ${{ github.workspace }}
        run: |
          VERSION=$(grep -E '^version:' packages/vieneu_tts/pubspec.yaml | awk '{print $2}' | tr -d '\r')
          SO_PATH=$(find packages/vieneu_tts/.dart_tool /tmp -name "librust_lib_vieneu_tts.so" 2>/dev/null | head -n 1)
          if [ -z "$SO_PATH" ]; then
            echo "Building release library for archive..."
            (cd packages/vieneu_tts/rust && cargo build --release)
            SO_PATH="packages/vieneu_tts/rust/target/release/librust_lib_vieneu_tts.so"
          fi
          mkdir -p dist
          cp "$SO_PATH" dist/librust_lib_vieneu_tts.so
          tar -czvf "dist/vieneu_tts-linux-x64-v${VERSION}.tar.gz" -C dist librust_lib_vieneu_tts.so
          rm -f dist/librust_lib_vieneu_tts.so
          (cd dist && sha256sum "vieneu_tts-linux-x64-v${VERSION}.tar.gz" > "vieneu_tts-linux-x64-v${VERSION}.tar.gz.sha256")
          ls -lh dist/

      - name: Upload Linux Prebuilt Archive
        uses: actions/upload-artifact@v4
        with:
          name: linux-prebuilt-dist
          path: dist/*
          retention-days: 1

  test-hook-prebuilt-mode:
    name: Test Hook in Prebuilt Mode (VIENEU_TTS_BUILD_MODE=prebuilt, Zero-Rust)
    needs: [codegen, test-hook-source-mode]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/vieneu_tts

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Generated Bindings
        uses: actions/download-artifact@v4
        with:
          name: frb-bindings
          path: packages/vieneu_tts

      - name: Download Linux Prebuilt Archive
        uses: actions/download-artifact@v4
        with:
          name: linux-prebuilt-dist
          path: dist

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Purge Rust Toolchain (Zero-Rust Consumer Simulation)
        run: |
          sudo rm -rf /home/runner/.cargo /home/runner/.rustup /usr/share/rust /usr/local/cargo
          export PATH=$(echo "$PATH" | tr ':' '\n' | grep -v 'cargo' | tr '\n' ':')
          echo "PATH=$PATH" >> $GITHUB_ENV

      - name: Serve Prebuilt Archive & Run Tests in Prebuilt Mode
        env:
          VIENEU_TTS_BUILD_MODE: "prebuilt"
          VIENEU_TTS_BINARY_URL: "http://127.0.0.1:8080"
        run: |
          nohup python3 -m http.server 8080 --directory "${{ github.workspace }}/dist" > /tmp/prebuilt_server.log 2>&1 &
          sleep 2
          flutter pub get
          mkdir -p .dart_tool
          printf "VIENEU_TTS_BUILD_MODE=prebuilt\nVIENEU_TTS_BINARY_URL=http://127.0.0.1:8080\n" > .dart_tool/vieneu_tts_env
          flutter test --verbose
          rm -f .dart_tool/vieneu_tts_env

  rust-check:
    name: Rust Bridge & audio-cpp Check
    needs: [codegen]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/vieneu_tts/rust

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Generated Bindings
        uses: actions/download-artifact@v4
        with:
          name: frb-bindings
          path: packages/vieneu_tts

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.93.1"
          targets: x86_64-unknown-linux-gnu

      - name: Install build tools (CMake, Ninja)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build libasound2-dev

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/vieneu_tts/rust

      - name: Cargo Check
        run: cargo check --verbose

  build-android:
    name: Android NDK Build (arm64-v8a)
    needs: [codegen]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/vieneu_tts/rust

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Generated Bindings
        uses: actions/download-artifact@v4
        with:
          name: frb-bindings
          path: packages/vieneu_tts

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.93.1"
          targets: aarch64-linux-android

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28
          add-to-path: true

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked || true

      - name: Install CMake & Ninja
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build

      - name: Build Android arm64-v8a shared library
        run: |
          mkdir -p ../android/src/main/jniLibs
          cargo ndk -t arm64-v8a -o ../android/src/main/jniLibs build --release --verbose
          NDK_DIR=$(find /usr/local/lib/android/sdk/ndk -maxdepth 1 -mindepth 1 -type d 2>/dev/null | sort -V | tail -n 1)
          ARM64_LIBCXX=$(find "$NDK_DIR" -path "*/aarch64-linux-android*/libc++_shared.so" 2>/dev/null | head -n 1)
          cp "$ARM64_LIBCXX" ../android/src/main/jniLibs/arm64-v8a/
          ls -lh ../android/src/main/jniLibs/arm64-v8a/

      - name: Upload Android jniLibs
        uses: actions/upload-artifact@v4
        with:
          name: android-jnilibs
          path: packages/vieneu_tts/android/src/main/jniLibs/
          retention-days: 1

  build-ios:
    name: iOS Target Check (aarch64-apple-ios)
    needs: [codegen]
    runs-on: macos-14
    defaults:
      run:
        working-directory: packages/vieneu_tts/rust

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Generated Bindings
        uses: actions/download-artifact@v4
        with:
          name: frb-bindings
          path: packages/vieneu_tts

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.93.1"
          targets: aarch64-apple-ios, aarch64-apple-ios-sim

      - name: Install CMake and Ninja
        run: brew install cmake ninja

      - name: Cargo check for iOS target
        run: cargo check --target aarch64-apple-ios --verbose
        env:
          CMAKE_PROJECT_INCLUDE_BEFORE: ${{ github.workspace }}/packages/vieneu_tts/rust/ios_compat.cmake

  build-example-apk:
    name: Build Example App & Android APK
    needs: [codegen, dart-lint, build-android]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/flutter_vieneu_tts/example

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Generated Bindings
        uses: actions/download-artifact@v4
        with:
          name: frb-bindings
          path: packages/vieneu_tts

      - name: Download Android jniLibs
        uses: actions/download-artifact@v4
        with:
          name: android-jnilibs
          path: packages/vieneu_tts/android/src/main/jniLibs

      - name: Package Android prebuilt archive for hook resolution
        working-directory: ${{ github.workspace }}
        run: |
          VERSION=$(grep -E '^version:' packages/vieneu_tts/pubspec.yaml | awk '{print $2}' | tr -d '\r')
          mkdir -p dist
          tar -czvf "dist/vieneu_tts-android-arm64-v${VERSION}.tar.gz" -C packages/vieneu_tts/android/src/main/jniLibs/arm64-v8a librust_lib_vieneu_tts.so libc++_shared.so
          (cd dist && sha256sum "vieneu_tts-android-arm64-v${VERSION}.tar.gz" > "vieneu_tts-android-arm64-v${VERSION}.tar.gz.sha256")

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install root & plugin dependencies
        working-directory: ${{ github.workspace }}
        run: |
          (cd packages/vieneu_tts && flutter pub get)
          (cd packages/flutter_vieneu_tts && flutter pub get)

      - name: Install example dependencies
        run: flutter pub get

      - name: Run Example App Tests & Lint
        run: |
          flutter analyze
          flutter test test/app_test.dart --verbose

      - name: Build Android Release APK (arm64-v8a via Prebuilt Mode)
        env:
          VIENEU_TTS_BUILD_MODE: "prebuilt"
        run: |
          mkdir -p ../../vieneu_tts/.dart_tool
          echo "VIENEU_TTS_BUILD_MODE=prebuilt" > ../../vieneu_tts/.dart_tool/vieneu_tts_env
          flutter build apk --release --target-platform android-arm64 --android-skip-build-dependency-validation
          rm -f ../../vieneu_tts/.dart_tool/vieneu_tts_env

      - name: Verify APK Integrity & Embedded Native Libraries
        run: |
          APK_FILE="build/app/outputs/flutter-apk/app-release.apk"
          if [ ! -f "$APK_FILE" ]; then
            echo "ERROR: APK not found at $APK_FILE"
            exit 1
          fi
          echo "=== APK File Info ==="
          ls -lh "$APK_FILE"
          echo "=== Native Libraries in APK ==="
          unzip -l "$APK_FILE" | grep "lib/" || true
          if unzip -l "$APK_FILE" | grep -q "librust_lib_vieneu_tts.so"; then
            echo "✓ Confirmed: librust_lib_vieneu_tts.so is bundled inside the release APK!"
          else
            echo "ERROR: librust_lib_vieneu_tts.so not found in APK!"
            exit 1
          fi

      - name: Upload Android Release APK
        uses: actions/upload-artifact@v4
        with:
          name: vieneu-tts-android-apk
          path: packages/flutter_vieneu_tts/example/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

  e2e-synthesis:
    name: E2E Inference & Audio Verification
    needs: [codegen]
    if: ${{ github.event.inputs.run_e2e_test == 'true' || contains(github.event.head_commit.message, '[run-e2e]') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/vieneu_tts

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Generated Bindings
        uses: actions/download-artifact@v4
        with:
          name: frb-bindings
          path: packages/vieneu_tts

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.93.1"

      - name: Install CMake, Ninja & Audio libraries
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libasound2-dev curl

      - name: Download official GGUF Model weights & SEA-G2P Dictionary
        run: |
          mkdir -p /tmp/vieneu_test
          curl -sSfL -o /tmp/vieneu_test/model.gguf "https://huggingface.co/pnnbao-ump/VieNeu-TTS-v3-Turbo/resolve/main/gguf/vieneu-v3-turbo-q8_0.gguf"
          curl -sSfL -o /tmp/vieneu_test/sea_g2p.bin "https://github.com/pnnbao97/sea-g2p/releases/download/v0.10.0/sea_g2p.bin"
          ls -lh /tmp/vieneu_test/

      - name: Run Flutter Unit & Integration Tests
        run: |
          flutter pub get
          flutter test
          cd ../flutter_vieneu_tts/example && flutter pub get && flutter test

      - name: Run E2E Audio Synthesis & Streaming Test
        working-directory: packages/vieneu_tts/rust
        env:
          MODEL_PATH: /tmp/vieneu_test/model.gguf
          DICT_PATH: /tmp/vieneu_test/sea_g2p.bin
          OUTPUT_DIR: ../output_audio
        run: |
          cargo run --example test_synthesis --verbose
          ls -lh ../output_audio/

      - name: Upload Synthesized Audio Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: synthesized-audio
          path: packages/vieneu_tts/output_audio/*.wav
          retention-days: 7
