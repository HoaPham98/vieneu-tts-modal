name: Android Example App CI & On-Device Integration Test

on:
  push:
    branches:
      - main
    paths:
      - "packages/vieneu_tts/**"
      - ".github/workflows/example-app-android.yml"
      - ".github/scripts/**"
  pull_request:
    branches:
      - main
    paths:
      - "packages/vieneu_tts/**"
      - ".github/workflows/example-app-android.yml"
      - ".github/scripts/**"
  workflow_dispatch:

concurrency:
  group: example-app-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-and-package:
    name: Build, Test & Package Android Example App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache Android jniLibs
        id: cache-jnilibs
        uses: actions/cache@v4
        with:
          path: packages/vieneu_tts/android/src/main/jniLibs
          key: jnilibs-android-v2-${{ hashFiles('packages/vieneu_tts/rust/**', 'packages/vieneu_tts/pubspec.yaml') }}

      - name: Cache Generated Bindings
        id: cache-bindings
        uses: actions/cache@v4
        with:
          path: |
            packages/vieneu_tts/lib/src/rust/
            packages/vieneu_tts/rust/src/frb_generated.*
          key: frb-bindings-v2-${{ hashFiles('packages/vieneu_tts/rust/**', 'packages/vieneu_tts/pubspec.yaml') }}

      - name: Check jniLibs readiness
        id: check-jnilibs
        run: |
          if [ "${{ steps.cache-jnilibs.outputs.cache-hit }}" == "true" ] && [ "${{ steps.cache-bindings.outputs.cache-hit }}" == "true" ] && [ -f "packages/vieneu_tts/android/src/main/jniLibs/arm64-v8a/librust_lib_vieneu_tts.so" ] && [ -f "packages/vieneu_tts/android/src/main/jniLibs/x86_64/librust_lib_vieneu_tts.so" ]; then
            echo "ready=true" >> $GITHUB_OUTPUT
            echo "✓ Native libraries exactly matched cache!"
          else
            echo "ready=false" >> $GITHUB_OUTPUT
            echo "Cache miss or Rust code modified: building native libraries from source..."
            rm -rf packages/vieneu_tts/android/src/main/jniLibs/*
          fi

      - name: Setup Rust toolchain
        if: steps.check-jnilibs.outputs.ready != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android

      - name: Install flutter_rust_bridge_codegen
        if: steps.check-jnilibs.outputs.ready != 'true'
        run: |
          curl -sSfL https://github.com/fzyzcjy/flutter_rust_bridge/releases/download/v2.0.0/flutter_rust_bridge_codegen-x86_64-unknown-linux-gnu-v2.0.0.tgz | sudo tar -xz -C /usr/local/bin
          flutter_rust_bridge_codegen --version

      - name: Generate Bindings
        if: steps.check-jnilibs.outputs.ready != 'true'
        run: |
          mkdir -p packages/vieneu_tts/lib/src/rust
          cd packages/vieneu_tts
          flutter pub get
          flutter_rust_bridge_codegen generate

      - name: Setup Android NDK
        if: steps.check-jnilibs.outputs.ready != 'true'
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b
          add-to-path: true

      - name: Install cargo-ndk
        if: steps.check-jnilibs.outputs.ready != 'true'
        run: cargo install cargo-ndk --locked || true

      - name: Install CMake & Ninja
        if: steps.check-jnilibs.outputs.ready != 'true'
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build

      - name: Rust Cache
        if: steps.check-jnilibs.outputs.ready != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/vieneu_tts/rust

      - name: Build Android arm64-v8a & x86_64 shared libraries
        if: steps.check-jnilibs.outputs.ready != 'true'
        working-directory: packages/vieneu_tts/rust
        run: |
          mkdir -p ../android/src/main/jniLibs
          cargo ndk -t arm64-v8a -t x86_64 -o ../android/src/main/jniLibs build --release --verbose

      - name: Stage native libraries & bundle libc++_shared.so
        run: |
          cd packages/vieneu_tts/example
          mkdir -p android/app/src/main/jniLibs/arm64-v8a android/app/src/main/jniLibs/x86_64
          cp -r ../android/src/main/jniLibs/* android/app/src/main/jniLibs/

          # Find and bundle libc++_shared.so from pre-installed Android NDK
          NDK_DIR=$(find /usr/local/lib/android/sdk/ndk -maxdepth 1 -mindepth 1 -type d 2>/dev/null | sort -V | tail -n 1)
          echo "Using Android NDK at: $NDK_DIR"

          ARM64_LIBCXX=$(find "$NDK_DIR" -path "*/aarch64-linux-android*/libc++_shared.so" 2>/dev/null | head -n 1)
          X64_LIBCXX=$(find "$NDK_DIR" -path "*/x86_64-linux-android*/libc++_shared.so" 2>/dev/null | head -n 1)

          echo "ARM64 libc++: $ARM64_LIBCXX"
          echo "X86_64 libc++: $X64_LIBCXX"

          if [ -n "$ARM64_LIBCXX" ] && [ -f "$ARM64_LIBCXX" ]; then
            cp "$ARM64_LIBCXX" android/app/src/main/jniLibs/arm64-v8a/
            cp "$ARM64_LIBCXX" ../android/src/main/jniLibs/arm64-v8a/
          else
            echo "ERROR: aarch64 libc++_shared.so not found!"
            exit 1
          fi

          if [ -n "$X64_LIBCXX" ] && [ -f "$X64_LIBCXX" ]; then
            cp "$X64_LIBCXX" android/app/src/main/jniLibs/x86_64/
            cp "$X64_LIBCXX" ../android/src/main/jniLibs/x86_64/
          else
            echo "ERROR: x86_64 libc++_shared.so not found!"
            exit 1
          fi

          [ -f android/gradlew ] && chmod +x android/gradlew || true
          ls -laR android/app/src/main/jniLibs/

      - name: Enable KVM permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 666 /dev/kvm || true
          ls -l /dev/kvm || true

      - name: Install dependencies & analyze
        run: |
          cd packages/vieneu_tts
          flutter pub get
          cd example
          flutter pub get
          flutter analyze

      - name: Cache Model Weights on Host Runner
        id: cache-models
        uses: actions/cache@v4
        with:
          path: /tmp/vieneu_models
          key: vieneu-models-assets-v1

      - name: Download Model Weights on Host Runner if cache missed
        if: steps.cache-models.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp/vieneu_models
          echo "Downloading GGUF model..."
          curl -sSfL -o /tmp/vieneu_models/vieneu-v3-turbo-q8_0.gguf "https://huggingface.co/pnnbao-ump/VieNeu-TTS-v3-Turbo/resolve/main/gguf/vieneu-v3-turbo-q8_0.gguf"
          echo "Downloading SEA-G2P dictionary..."
          curl -sSfL -o /tmp/vieneu_models/sea_g2p.bin "https://github.com/pnnbao97/sea-g2p/releases/download/v0.10.0/sea_g2p.bin"
          ls -lh /tmp/vieneu_models/

      - name: Run On-Device Integration Test on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio
          script: bash .github/scripts/run_emulator_test.sh

      - name: Build Android Release APK (arm64-v8a)
        working-directory: packages/vieneu_tts/example
        run: |
          flutter build apk --release --target-platform android-arm64 --android-skip-build-dependency-validation

      - name: Verify APK Integrity & Embedded Native Libraries
        working-directory: packages/vieneu_tts/example
        run: |
          APK_FILE="build/app/outputs/flutter-apk/app-release.apk"
          if [ ! -f "$APK_FILE" ]; then
            echo "ERROR: APK not found at $APK_FILE"
            exit 1
          fi
          echo "=== APK File Info ==="
          ls -lh "$APK_FILE"
          python3 -c "import zipfile; z = zipfile.ZipFile('$APK_FILE'); libs = [f.filename for f in z.infolist() if 'lib/' in f.filename]; print('Embedded native libs:'); [print(' -', l) for l in libs]; assert any('librust_lib_vieneu_tts.so' in l for l in libs), 'librust_lib_vieneu_tts.so missing!'; assert any('libc++_shared.so' in l for l in libs), 'libc++_shared.so missing!'"

      - name: Upload Android Release APK
        uses: actions/upload-artifact@v4
        with:
          name: vieneu-tts-example-apk
          path: packages/vieneu_tts/example/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
