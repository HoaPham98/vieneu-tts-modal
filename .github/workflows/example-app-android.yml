name: Android Example App CI & On-Device Integration Test

on:
  push:
    branches:
      - main
    paths:
      - "packages/vieneu_tts/**"
      - "packages/flutter_vieneu_tts/**"
      - ".github/workflows/example-app-android.yml"
      - ".github/scripts/**"
  pull_request:
    branches:
      - main
    paths:
      - "packages/vieneu_tts/**"
      - "packages/flutter_vieneu_tts/**"
      - ".github/workflows/example-app-android.yml"
      - ".github/scripts/**"
  workflow_dispatch:

concurrency:
  group: example-app-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-and-package:
    name: Build, Test & Package Android Example App
    runs-on: ubuntu-latest
    env:
      VIENEU_TTS_BINARY_URL: "http://127.0.0.1:8080"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache Prebuilt Android Archives
        id: cache-prebuilts
        uses: actions/cache@v4
        with:
          path: dist
          key: prebuilt-android-v1-${{ hashFiles('packages/vieneu_tts/rust/**', 'packages/vieneu_tts/pubspec.yaml') }}

      - name: Cache Generated Bindings
        id: cache-bindings
        uses: actions/cache@v4
        with:
          path: |
            packages/vieneu_tts/lib/src/rust/
            packages/vieneu_tts/rust/src/frb_generated.*
          key: frb-bindings-v3-${{ hashFiles('packages/vieneu_tts/rust/**', 'packages/vieneu_tts/pubspec.yaml') }}

      - name: Check prebuilt readiness
        id: check-prebuilts
        run: |
          if [ "${{ steps.cache-prebuilts.outputs.cache-hit }}" == "true" ] && [ "${{ steps.cache-bindings.outputs.cache-hit }}" == "true" ] && [ -f "dist/vieneu_tts-android-arm64-v0.1.0.tar.gz" ] && [ -f "dist/vieneu_tts-android-x64-v0.1.0.tar.gz" ]; then
            echo "ready=true" >> $GITHUB_OUTPUT
            echo "✓ Prebuilt native archives exactly matched cache!"
          else
            echo "ready=false" >> $GITHUB_OUTPUT
            echo "Cache miss or Rust code modified: compiling native prebuilt archives from source..."
            rm -rf dist/*
          fi

      - name: Setup Rust toolchain
        if: steps.check-prebuilts.outputs.ready != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android

      - name: Install flutter_rust_bridge_codegen
        if: steps.check-prebuilts.outputs.ready != 'true'
        run: |
          curl -sSfL https://github.com/fzyzcjy/flutter_rust_bridge/releases/download/v2.0.0/flutter_rust_bridge_codegen-x86_64-unknown-linux-gnu-v2.0.0.tgz | sudo tar -xz -C /usr/local/bin
          flutter_rust_bridge_codegen --version

      - name: Generate Bindings
        if: steps.check-prebuilts.outputs.ready != 'true'
        run: |
          mkdir -p packages/vieneu_tts/lib/src/rust
          cd packages/vieneu_tts
          flutter pub get
          flutter_rust_bridge_codegen generate

      - name: Setup Android NDK
        if: steps.check-prebuilts.outputs.ready != 'true'
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b
          add-to-path: true

      - name: Install cargo-ndk
        if: steps.check-prebuilts.outputs.ready != 'true'
        run: cargo install cargo-ndk --locked || true

      - name: Install CMake & Ninja
        if: steps.check-prebuilts.outputs.ready != 'true'
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build

      - name: Rust Cache
        if: steps.check-prebuilts.outputs.ready != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/vieneu_tts/rust

      - name: Compile and Package Prebuilt Archives
        if: steps.check-prebuilts.outputs.ready != 'true'
        run: |
          cd packages/vieneu_tts/rust
          mkdir -p ../android_build
          cargo ndk -t arm64-v8a -t x86_64 -o ../android_build build --release --verbose

          # Locate libc++_shared.so from NDK
          NDK_DIR=$(find /usr/local/lib/android/sdk/ndk -maxdepth 1 -mindepth 1 -type d 2>/dev/null | sort -V | tail -n 1)
          ARM64_LIBCXX=$(find "$NDK_DIR" -path "*/aarch64-linux-android*/libc++_shared.so" 2>/dev/null | head -n 1)
          X64_LIBCXX=$(find "$NDK_DIR" -path "*/x86_64-linux-android*/libc++_shared.so" 2>/dev/null | head -n 1)

          cp "$ARM64_LIBCXX" ../android_build/arm64-v8a/
          cp "$X64_LIBCXX" ../android_build/x86_64/

          cd ../../..
          mkdir -p dist
          tar -czvf dist/vieneu_tts-android-arm64-v0.1.0.tar.gz -C packages/vieneu_tts/android_build/arm64-v8a librust_lib_vieneu_tts.so libc++_shared.so
          tar -czvf dist/vieneu_tts-android-x64-v0.1.0.tar.gz -C packages/vieneu_tts/android_build/x86_64 librust_lib_vieneu_tts.so libc++_shared.so

          cd dist
          sha256sum vieneu_tts-android-arm64-v0.1.0.tar.gz > vieneu_tts-android-arm64-v0.1.0.tar.gz.sha256
          sha256sum vieneu_tts-android-x64-v0.1.0.tar.gz > vieneu_tts-android-x64-v0.1.0.tar.gz.sha256
          ls -lh

      - name: Start Mock Artifact Server
        run: |
          mkdir -p dist
          nohup python3 -m http.server 8080 --directory dist > /tmp/artifact_server.log 2>&1 &
          sleep 2
          curl -I http://127.0.0.1:8080/vieneu_tts-android-arm64-v0.1.0.tar.gz
          echo "VIENEU_TTS_BINARY_URL=http://127.0.0.1:8080" >> $GITHUB_ENV

      - name: PURGE Rust and Android NDK toolchains
        run: |
          echo "=== Purging Rust & Cargo ==="
          sudo rm -rf /home/runner/.cargo /home/runner/.rustup /usr/share/rust /usr/local/cargo
          export PATH=$(echo "$PATH" | tr ':' '\n' | grep -v 'cargo' | tr '\n' ':')
          echo "PATH=$PATH" >> $GITHUB_ENV

          echo "=== Purging Android NDK ==="
          sudo rm -rf /usr/local/lib/android/sdk/ndk*
          unset ANDROID_NDK_HOME
          unset ANDROID_NDK_ROOT

          echo "=== Verifying Hermetic Zero-Rust Consumer Environment ==="
          if command -v cargo &> /dev/null; then
            echo "ERROR: cargo is still installed!"
            exit 1
          fi
          if command -v rustc &> /dev/null; then
            echo "ERROR: rustc is still installed!"
            exit 1
          fi
          echo "✓ Confirmed: Runner has ZERO Rust and ZERO NDK toolchains!"

      - name: Enable KVM permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 666 /dev/kvm || true
          ls -l /dev/kvm || true

      - name: Install dependencies & analyze packages
        env:
          VIENEU_TTS_BINARY_URL: "http://127.0.0.1:8080"
        run: |
          cd packages/vieneu_tts
          dart pub get
          cd ../flutter_vieneu_tts
          flutter pub get
          flutter analyze
          cd example
          flutter pub get
          flutter analyze

      - name: Cache Model Weights on Host Runner
        id: cache-models
        uses: actions/cache@v4
        with:
          path: /tmp/vieneu_models
          key: vieneu-models-assets-v3

      - name: Download Model Weights on Host Runner if cache missed
        if: steps.cache-models.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp/vieneu_models
          echo "Downloading GGUF model..."
          curl -sSfL -o /tmp/vieneu_models/model.gguf "https://huggingface.co/pnnbao-ump/VieNeu-TTS-v3-Turbo/resolve/main/gguf/vieneu-v3-turbo-q8_0.gguf"
          cp /tmp/vieneu_models/model.gguf /tmp/vieneu_models/vieneu-v3-turbo-q8_0.gguf
          echo "Downloading SEA-G2P dictionary..."
          curl -sSfL -o /tmp/vieneu_models/sea_g2p.bin "https://github.com/pnnbao97/sea-g2p/releases/download/v0.10.0/sea_g2p.bin"

      - name: Prepare Model Sidecar Configs on Host Runner
        run: |
          if [ -f /tmp/vieneu_models/vieneu-v3-turbo-q8_0.gguf ] && [ ! -f /tmp/vieneu_models/model.gguf ]; then
            cp /tmp/vieneu_models/vieneu-v3-turbo-q8_0.gguf /tmp/vieneu_models/model.gguf
          fi
          if [ -f /tmp/vieneu_models/model.gguf ] && [ ! -f /tmp/vieneu_models/vieneu-v3-turbo-q8_0.gguf ]; then
            cp /tmp/vieneu_models/model.gguf /tmp/vieneu_models/vieneu-v3-turbo-q8_0.gguf
          fi
          mkdir -p /tmp/vieneu_models/model_specs /tmp/vieneu_models/speech_tokenizer
          cp packages/vieneu_tts/rust/assets/model_spec.json /tmp/vieneu_models/
          cp packages/vieneu_tts/rust/assets/model_spec.json /tmp/vieneu_models/vieneu_v3_turbo.json
          cp packages/vieneu_tts/rust/assets/model_spec.json /tmp/vieneu_models/model_specs/vieneu_v3_turbo.json
          cp packages/vieneu_tts/rust/assets/config.json /tmp/vieneu_models/
          cp packages/vieneu_tts/rust/assets/tokenizer_config.json /tmp/vieneu_models/
          cp packages/vieneu_tts/rust/assets/speech_tokenizer_config.json /tmp/vieneu_models/speech_tokenizer/config.json
          ls -laR /tmp/vieneu_models/

      - name: Run On-Device Integration Test on Android Emulator (Prebuilt Binaries)
        env:
          VIENEU_TTS_BINARY_URL: "http://127.0.0.1:8080"
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio
          script: bash .github/scripts/run_emulator_test.sh

      - name: Build Android Release APK (Zero-Rust Consumer Verification)
        env:
          VIENEU_TTS_BINARY_URL: "http://127.0.0.1:8080"
        working-directory: packages/flutter_vieneu_tts/example
        run: |
          if ! curl -s -I http://127.0.0.1:8080/vieneu_tts-android-arm64-v0.1.0.tar.gz > /dev/null; then
            echo "Mock artifact server not responding, starting it on port 8080..."
            nohup python3 -m http.server 8080 --directory "$GITHUB_WORKSPACE/dist" > /tmp/artifact_server.log 2>&1 &
            sleep 2
          fi
          flutter build apk --release --target-platform android-arm64 --android-skip-build-dependency-validation

      - name: Verify APK Integrity & Embedded Prebuilt Libraries
        working-directory: packages/flutter_vieneu_tts/example
        run: |
          APK_FILE="build/app/outputs/flutter-apk/app-release.apk"
          if [ ! -f "$APK_FILE" ]; then
            echo "ERROR: APK not found at $APK_FILE"
            exit 1
          fi
          echo "=== APK File Info ==="
          ls -lh "$APK_FILE"
          python3 -c "import zipfile; z = zipfile.ZipFile('$APK_FILE'); libs = [f.filename for f in z.infolist() if 'lib/' in f.filename]; print('Embedded native libs:'); [print(' -', l) for l in libs]; assert any('librust_lib_vieneu_tts.so' in l for l in libs), 'librust_lib_vieneu_tts.so missing!'; assert any('libc++_shared.so' in l for l in libs), 'libc++_shared.so missing!'"
          echo "✓ Consumer APK successfully packaged with prebuilt native assets!"

      - name: Upload Android Release APK
        uses: actions/upload-artifact@v4
        with:
          name: vieneu-tts-example-apk
          path: packages/flutter_vieneu_tts/example/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
